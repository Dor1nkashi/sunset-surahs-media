# Sunset Surahs auto-poster: runs in GitHub's cloud, so the laptop can be off.
# Each Sydney posting window has multiple chances to run.
# Posting attempts are checkpointed to the repository before upload.
name: Sunset Surahs poster
on:
  schedule:
    - cron: "17,37,57 12,17,18,19,20 * * *"
      timezone: "Australia/Sydney"
    # UTC retry windows cover both Sydney daylight-saving offsets.
    - cron: "7 1,2,6,7,8,9,10 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sunset-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Australia/Sydney
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: poster
          filter: blob:none
      - name: Load tokens (from the repo secret POSTER_SECRETS)
        env:
          POSTER_SECRETS: ${{ secrets.POSTER_SECRETS }}
        run: |
          if [ -z "$POSTER_SECRETS" ]; then echo "::error::POSTER_SECRETS is missing"; exit 1; fi
          umask 077; printf '%s' "$POSTER_SECRETS" > poster/secrets.json
      - name: Configure posting record commits
        run: |
          git config user.name "sunset-poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Post what is due
        env:
          POSTER_CHECKPOINT: ${{ github.workspace }}/poster/checkpoint.sh
        run: python3 poster/poster.py run
      - name: Clean up tokens
        if: always()
        run: rm -f poster/secrets.json
