# Sunset Surahs auto-poster: runs in GitHub's cloud, so the laptop can be off.
# Every 30 min it runs poster/poster.py, which posts only when a slot in poster/config.json is due
# (Melbourne time) and never posts the same video twice (poster/posted.json is saved back here).
name: Sunset Surahs poster
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sunset-poster
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Australia/Melbourne
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: poster
          filter: blob:none
      - name: Load tokens (from the repo secret POSTER_SECRETS)
        env:
          POSTER_SECRETS: ${{ secrets.POSTER_SECRETS }}
        run: |
          if [ -z "$POSTER_SECRETS" ]; then echo "POSTER_SECRETS not set yet"; exit 0; fi
          umask 077; printf '%s' "$POSTER_SECRETS" > poster/secrets.json
      - name: Post what is due
        run: |
          if [ ! -f poster/secrets.json ]; then exit 0; fi
          cd poster && python3 poster.py run || true
          python3 poster.py status || true
      - name: Save posting record
        if: always()
        run: |
          rm -f poster/secrets.json
          git config user.name "sunset-poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse poster/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "poster: update posting record"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
